<style>
 html,body{margin:0;height:100dvh;overflow:hidden;background:#000;font-family:-apple-system,sans-serif;touch-action:none}
 #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;background:#0a0f14;z-index:10}
 #load svg{width:auto;height:min(80vh,150vw);max-width:92vw}
 #loadTxt{font-size:15px;color:rgba(255,255,255,.7);letter-spacing:.06em}
 #ui{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:11;color:rgba(255,255,255,.9);font-size:15px}
 
 .row{display:flex;justify-content:center;align-items:flex-end;gap:16px;flex-wrap:nowrap;white-space:nowrap}
 #spdwrap,.tglwrap{align-self:flex-end}
 #bRestart{align-self:flex-end;height:35px}
 .gy{display:flex;align-items:center}
 .sl{display:flex;flex-direction:column;align-items:center;gap:6px}
 .sl span{font-variant-numeric:tabular-nums;text-shadow:0 1px 4px #000}
 input[type=range]{-webkit-appearance:none;appearance:none;width:min(27vw,170px);height:30px;background:transparent}
 input[type=range]::-webkit-slider-runnable-track{height:3px;background:rgba(255,255,255,.5);border-radius:1px}
 input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 1px 6px rgba(0,0,0,.6)}
 input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,.5)}
 input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:none}
 #bRestart{background:none;border:none;color:rgba(255,255,255,.9);font-size:34px;display:flex;align-items:center;padding:0 6px;text-shadow:0 1px 6px #000}
 #gyroAsk{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:rgba(0,0,0,.45)}
 #gyroAsk button{background:rgba(255,255,255,.15);backdrop-filter:blur(12px);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:16px 26px;font-size:17px}
 #bRide{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;z-index:6;background:rgba(20,20,20,.6);
  color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:14px;font-size:15px;padding:6px 14px}
 #bRide.on{color:#fc3;border-color:#fc3}
 #crash{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:30vw;z-index:8;
  pointer-events:none;background:rgba(255,60,30,.25)}

 #ui{opacity:1}
 .tglwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
 ..tlab-x{}
 .tlab{font-size:18px;color:#fff;color:rgba(255,255,255,.75);text-shadow:0 1px 4px #000}
 .switch{position:relative;width:58px;height:35px;display:inline-block}
 .switch input{opacity:0;width:0;height:0}
 .knob{position:absolute;inset:0;border-radius:16px;background:rgba(120,120,128,.45);transition:.25s;cursor:pointer}
 .knob:before{content:"";position:absolute;width:31px;height:31px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
 .switch input:checked + .knob{background:#34c759}
 .switch input:checked + .knob:before{transform:translateX(23px)}
 #spdwrap{position:relative;display:flex;align-items:center;gap:8px}
 #spdwrap .arr{display:flex;align-items:center;opacity:.85;touch-action:manipulation;cursor:pointer;padding:8px 4px}
 #sSpeed{width:min(56vw,520px)!important}
 #spdLab{position:absolute;top:-20px;left:0;font-size:14px;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 4px #000;transform:translateX(-50%);pointer-events:none;white-space:nowrap}
#sSpeed.pulse::-webkit-slider-thumb{animation:thpulse .8s ease-in-out 2}
@keyframes thpulse{0%{box-shadow:0 0 0 2px rgba(255,255,255,.9)}50%{box-shadow:0 0 0 28px rgba(255,255,255,.15)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

@media (max-width:700px){
  .row{width:100%;box-sizing:border-box;padding:0 14px;gap:22px;flex-direction:column;align-items:flex-start;white-space:normal}
  #gyroWrap,#sndwrap{align-self:flex-start}
  #bRestart{order:1;font-size:60px;line-height:56px;position:static;padding:0;align-self:flex-start;color:rgba(255,255,255,.55);font-weight:200;text-shadow:0 1px 4px rgba(0,0,0,.4)}
  #gyroWrap{order:2} #sndwrap{order:3;position:static}
  #spdwrap{order:4;width:100%;min-width:0;gap:6px;justify-content:center}
  #sSpeed{flex:1;width:auto!important;min-width:0;max-width:none}
  .tglwrap{flex-direction:row-reverse;align-items:center;gap:10px}
  .switch{width:52px;height:32px}
  .knob:before{width:28px;height:28px}
  .switch input:checked + .knob:before{transform:translateX(20px)}
  .tlab{font-size:17px}
 }
</style>
</head>
<body>

 <svg viewBox="0 0 400 560">

  <circle cx="290.5" cy="158.0" r="5" fill="#fff"/>
  <text x="290.5" y="146.0" fill="rgba(255,255,255,.85)" font-size="14" text-anchor="middle">старт</text>

 </svg>
 <div id="loadTxt">идём…</div>

  Если вылетает — открой ссылку в Safari/Chrome (меню ⋯ → «Открыть в браузере»)</div>

<div id="ui">
 <div class="row">
  <div class="tglwrap" id="gyroWrap" style="visibility:hidden"><span class="tlab" style="font-size:32px">⚛︎</span>
   <label class="switch"><input type="checkbox" id="gyroTgl"><span class="knob"></span></label></div>
  <button id="bRestart" style="visibility:hidden">⟲</button>
 </div>
 <div id="hint" style="font-size:13px;color:rgba(255,255,255,.55);text-shadow:0 1px 4px #000"></div>
</div>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "@mkkellogg/gaussian-splats-3d":"https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.min.js"
}}
</script>
<script type="module">
import * as GS from '@mkkellogg/gaussian-splats-3d';
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const routeEl=$('routeDone'), busEl=$('bus'), fullRoute=$('route'), RL=fullRoute.getTotalLength();
routeEl.style.strokeDasharray=RL; routeEl.style.strokeDashoffset=RL;
function setProgress(f){ f=Math.max(0,Math.min(1,f));
 routeEl.style.strokeDashoffset=RL*(1-f);
 const p=fullRoute.getPointAtLength(RL*f); busEl.setAttribute('cx',p.x); busEl.setAttribute('cy',p.y);
 $('loadTxt').textContent = f<1 ? 'идём… '+Math.round(f*100)+'%' : 'пришли';
}
async function fetchProgress(url,weight,base){
 const r=await fetch(url); const total=+r.headers.get('Content-Length')||0;
 const reader=r.body.getReader(); const chunks=[]; let got=0;
 while(true){ const {done,value}=await reader.read(); if(done)break;
  chunks.push(value); got+=value.length; if(total)setProgress(base+weight*got/total); }
 return new Blob(chunks);
}
if(/Telegram|Instagram|FBAN|FBAV|VKClient/i.test(navigator.userAgent)) $('inappHint').style.display='block';
const TRACK = await (await fetch('track.json')).json();
const DEM = await (await fetch('dem.json')).json();
function groundAt(x,z){
 const fx=(x-DEM.x0)/DEM.step, fz=(z-DEM.z0)/DEM.step;
 const ix=Math.max(0,Math.min(DEM.nx-2,Math.floor(fx))), iz=Math.max(0,Math.min(DEM.nz-2,Math.floor(fz)));
 const tx=Math.min(1,Math.max(0,fx-ix)), tz=Math.min(1,Math.max(0,fz-iz));
 const d=DEM.data, s=DEM.scale, w=DEM.nx;
 return (d[iz*w+ix]*(1-tx)*(1-tz)+d[iz*w+ix+1]*tx*(1-tz)+d[(iz+1)*w+ix]*(1-tx)*tz+d[(iz+1)*w+ix+1]*tx*tz)*s;
}
const N=TRACK.length;
let cx=0,cz=0; for(const pt of TRACK){cx+=pt[0];cz+=pt[2];} cx/=N; cz/=N;
let mx=1e9,Mx=-1e9,mz=1e9,Mz=-1e9; for(const p of TRACK){mx=Math.min(mx,p[0]);Mx=Math.max(Mx,p[0]);mz=Math.min(mz,p[2]);Mz=Math.max(Mz,p[2]);}
const yawInit=(Mx-mx)>(Mz-mz)?Math.PI/2:0;
const start=new THREE.Vector3(cx,groundAt(cx,cz)+0.30,cz);
const skyStart=new THREE.Vector3(start.x,start.y+1.1,start.z);
const viewer = new GS.Viewer({
 cameraUp:[0,1,0], initialCameraPosition:[skyStart.x,skyStart.y,skyStart.z], initialCameraLookAt:[start.x,start.y,start.z],
 sharedMemoryForWorkers:false, sphericalHarmonicsDegree:0, useBuiltInControls:false,
});
const IS_MOBILE=/iPhone|iPad|Android/i.test(navigator.userAgent);
const splatBlob = await fetchProgress(IS_MOBILE?'village_mobile.splat':'village_all.splat',0.33,0);
let fake=0.33;
const anim=setInterval(()=>{ fake+=(0.97-fake)*0.06; setProgress(fake); },250);
const blobUrl=URL.createObjectURL(splatBlob);
await viewer.addSplatScene(blobUrl,{format:GS.SceneFormat.Splat,showLoadingUI:false,rotation:[0.999276,-0.025749,0.000000,-0.028009],position:[0,0.7344,0]});
URL.revokeObjectURL(blobUrl);
clearInterval(anim); setProgress(1);
await new Promise(r=>setTimeout(r,600));
$('load').remove();
viewer.start();
const cam=viewer.camera;
function pathDir0(){ return yawInit; }
let phase='intro', t0=performance.now()/1000;
let yaw=pathDir0(), pitch=-0.05;
const pos=start.clone();
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true; if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);
let drag=null;
addEventListener('pointerdown',e=>{if(e.target.closest('#ui'))return;drag=[e.clientX,e.clientY];});
addEventListener('pointermove',e=>{if(!drag)return;
 yaw+=(e.clientX-drag[0])/innerWidth*3; pitch+=(e.clientY-drag[1])/innerHeight*2;
 pitch=Math.max(-1.35,Math.min(1.35,pitch)); drag=[e.clientX,e.clientY];});
addEventListener('pointerup',()=>drag=null);
// два пальца = вперёд (телефон)
let touchFwd=0;
addEventListener('touchstart',e=>{ if(e.touches.length>=2) touchFwd=1; });
addEventListener('touchend',e=>{ if(e.touches.length<2) touchFwd=0; });
// гироскоп (как в Реблё)
let gyro=null,gyroOn=false,gyroGranted=false;
const qDevice=new THREE.Quaternion(), qYawFix=new THREE.Quaternion(), qCam=new THREE.Quaternion();
const zee=new THREE.Vector3(0,0,1), upAxis=new THREE.Vector3(0,1,0), qScr2=new THREE.Quaternion(),
 q1=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5)), qScr=new THREE.Quaternion(), eul=new THREE.Euler();
function scrAngle(){ return THREE.MathUtils.degToRad(screen.orientation?screen.orientation.angle:(window.orientation||0)); }
function devQuat(e,out){
 eul.set(THREE.MathUtils.degToRad(e.beta||0),THREE.MathUtils.degToRad(e.alpha||0),-THREE.MathUtils.degToRad(e.gamma||0),'YXZ');
 out.setFromEuler(eul); out.multiply(q1); out.multiply(qScr.setFromAxisAngle(zee,-scrAngle()));
 return out; }
if(!('ontouchstart' in window)) $('gyroWrap').style.display='none';
addEventListener('deviceorientation',function probe(e){ if(e.alpha!==null){gyroGranted=true; gyro=e;} },{once:true});
addEventListener('deviceorientation',e=>{ if(gyroGranted) gyro=e; });
$('gyroTgl').onchange=async()=>{
 const want=$('gyroTgl').checked;
 if(want&&!gyroGranted){
  try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
    const r=await DeviceOrientationEvent.requestPermission();
    if(r!=='granted'){$('gyroTgl').checked=false;return;} }
   gyroGranted=true;
  }catch(e){$('gyroTgl').checked=false;return;}
 }
 gyroOn=want;
 if(gyroOn&&gyro){ devQuat(gyro,qDevice);
  const f=new THREE.Vector3(0,0,-1).applyQuaternion(qDevice);
  qYawFix.setFromAxisAngle(upAxis, yaw-Math.atan2(f.x,f.z)); }
};
$('bRestart').onclick=()=>{phase='intro';t0=performance.now()/1000;pos.copy(start);yaw=pathDir0();pitch=-0.05;
 ['gyroWrap','bRestart'].forEach(id=>$(id).style.visibility='hidden');$('hint').textContent='';};
function showUI(){ ['gyroWrap','bRestart'].forEach(id=>$(id).style.visibility='visible');
 $('hint').textContent = IS_MOBILE ? 'палец — смотреть · два пальца — вперёд' : 'WASD — полёт · Q/E — вниз/вверх · Shift — быстрее · мышь — смотреть';
 setTimeout(()=>{$('hint').style.transition='opacity 2s';$('hint').style.opacity='0';},9000); }
let last=performance.now();
function tick(){
 requestAnimationFrame(tick);
 const now=performance.now(), dt=Math.min((now-last)/1000,0.1); last=now;
 const tsec=now/1000;
 if(phase==='intro'){
  const u=Math.min(1,(tsec-t0)/4), e=u*u*(3-2*u);
  const p=new THREE.Vector3().lerpVectors(skyStart,start,e);
  cam.position.copy(p);
  const d0=pathDir0();
  const hor=new THREE.Vector3(start.x+Math.sin(d0)*3,start.y,start.z+Math.cos(d0)*3);
  const look=new THREE.Vector3().lerpVectors(new THREE.Vector3(cx,0,cz),hor,e);
  cam.lookAt(look.x,look.y,look.z);
  if(u>=1){phase='free';pos.copy(start);yaw=d0;pitch=-0.05;showUI();}
 } else {
  let f=(keys['KeyW']||keys['ArrowUp']?1:0)+(keys['KeyS']||keys['ArrowDown']?-1:0)+touchFwd;
  let r=(keys['KeyD']||keys['ArrowRight']?1:0)+(keys['KeyA']||keys['ArrowLeft']?-1:0);
  let v=(keys['KeyE']||keys['Space']?1:0)+(keys['KeyQ']||keys['KeyC']?-1:0);
  const spd=0.55*((keys['ShiftLeft']||keys['ShiftRight'])?3:1);
  const cp=Math.cos(pitch), sp=Math.sin(pitch), sy=Math.sin(yaw), cy=Math.cos(yaw);
  // вперёд — куда смотришь; вправо: yaw+90° (D — направо, A — налево)
  pos.x+=(f*sy*cp + r*cy)*spd*dt;
  pos.z+=(f*cy*cp - r*sy)*spd*dt;
  pos.y+=(f*sp + v)*spd*dt;
  pos.y=Math.max(pos.y, groundAt(pos.x,pos.z)+0.03);
  cam.position.copy(pos);
  if(gyroOn&&gyro){
   devQuat(gyro,qDevice);
   qScr2.setFromAxisAngle(upAxis,0);
   qCam.copy(qScr2).multiply(qYawFix).multiply(qDevice);
   cam.quaternion.copy(qCam);
   const fv=new THREE.Vector3(0,0,-1).applyQuaternion(qCam); yaw=Math.atan2(fv.x,fv.z);
  } else {
   cam.lookAt(pos.x+sy*cp, pos.y+sp, pos.z+cy*cp);
  }
 }
}
tick();
</script>
